<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF9800"/>
    </marker>
    <style>
      @keyframes stepBreathe {
        0%, 10% { opacity: 0; }
        20%, 70% { opacity: 1; }
        80%, 100% { opacity: 0; }
      }
      @keyframes arrowBlink {
        0%, 15% { opacity: 0; }
        25%, 65% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .step { animation: stepBreathe 8s ease-in-out infinite; }
      .st1 { animation-delay: 0s; }
      .st2 { animation-delay: 0.5s; }
      .st3 { animation-delay: 1.0s; }
      .st4 { animation-delay: 1.5s; }
      .st5 { animation-delay: 2.0s; }
      .st6 { animation-delay: 2.5s; }
      .arrow { animation: arrowBlink 8s ease-in-out infinite; }
      .a1 { animation-delay: 0.3s; }
      .a2 { animation-delay: 0.8s; }
      .a3 { animation-delay: 1.3s; }
      .a4 { animation-delay: 1.8s; }
      .a5 { animation-delay: 2.3s; }
      .glow { animation: glowPulse 3s ease-in-out infinite; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; fill: #fff; font-size: 11px; font-weight: 600; }
      .sublabel { font-family: 'Segoe UI', Arial, sans-serif; fill: rgba(255,255,255,0.85); font-size: 8px; }
    </style>
  </defs>

  <!-- Step 1 -->
  <g class="step st1">
    <rect class="glow" x="10" y="15" width="120" height="90" rx="12" fill="#FF5722"/>
    <text x="70" y="48" text-anchor="middle" font-size="20">🎯</text>
    <text class="label" x="70" y="68" text-anchor="middle">Khám phá</text>
    <text class="sublabel" x="70" y="82" text-anchor="middle">Phân tích · Mục tiêu</text>
  </g>

  <line class="arrow a1" x1="135" y1="60" x2="160" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <g class="step st2">
    <rect class="glow" x="160" y="15" width="120" height="90" rx="12" fill="#FF7043"/>
    <text x="220" y="48" text-anchor="middle" font-size="20">📐</text>
    <text class="label" x="220" y="68" text-anchor="middle">Thiết kế</text>
    <text class="sublabel" x="220" y="82" text-anchor="middle">UI/UX · Prototype</text>
  </g>

  <line class="arrow a2" x1="285" y1="60" x2="310" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->
  <g class="step st3">
    <rect class="glow" x="310" y="15" width="120" height="90" rx="12" fill="#FF8A65"/>
    <text x="370" y="48" text-anchor="middle" font-size="20">⚡</text>
    <text class="label" x="370" y="68" text-anchor="middle">Phát triển</text>
    <text class="sublabel" x="370" y="82" text-anchor="middle">Agile · CI/CD</text>
  </g>

  <line class="arrow a3" x1="435" y1="60" x2="460" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 4 -->
  <g class="step st4">
    <rect class="glow" x="460" y="15" width="120" height="90" rx="12" fill="#FF9800"/>
    <text x="520" y="48" text-anchor="middle" font-size="20">🔬</text>
    <text class="label" x="520" y="68" text-anchor="middle">Kiểm thử</text>
    <text class="sublabel" x="520" y="82" text-anchor="middle">Unit · UAT · Perf</text>
  </g>

  <line class="arrow a4" x1="585" y1="60" x2="610" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 5 -->
  <g class="step st5">
    <rect class="glow" x="610" y="15" width="120" height="90" rx="12" fill="#FFB74D"/>
    <text x="670" y="48" text-anchor="middle" font-size="20">🚀</text>
    <text class="label" x="670" y="68" text-anchor="middle">Triển khai</text>
    <text class="sublabel" x="670" y="82" text-anchor="middle">Deploy · Monitor</text>
  </g>

  <line class="arrow a5" x1="735" y1="60" x2="760" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 6 -->
  <g class="step st6">
    <rect class="glow" x="760" y="15" width="120" height="90" rx="12" fill="#FFC107"/>
    <text x="820" y="48" text-anchor="middle" font-size="20">🛡️</text>
    <text class="label" x="820" y="68" text-anchor="middle">Đồng hành</text>
    <text class="sublabel" x="820" y="82" text-anchor="middle">Bảo trì · Hỗ trợ</text>
  </g>
</svg>
