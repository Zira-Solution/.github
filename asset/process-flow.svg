<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <style>
      @keyframes fadeSlideIn {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(255,87,34,0.3)); }
        50% { filter: drop-shadow(0 0 10px rgba(255,87,34,0.7)); }
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 30; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flowDot {
        0% { opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; }
      }
      .step { animation: fadeSlideIn 0.6s ease forwards, pulseGlow 3s ease-in-out infinite; opacity: 0; }
      .step1 { animation-delay: 0s, 0.6s; }
      .step2 { animation-delay: 0.4s, 1.0s; }
      .step3 { animation-delay: 0.8s, 1.4s; }
      .step4 { animation-delay: 1.2s, 1.8s; }
      .step5 { animation-delay: 1.6s, 2.2s; }
      .step6 { animation-delay: 2.0s, 2.6s; }
      .arrow { stroke-dasharray: 30; animation: drawLine 0.5s ease forwards; stroke-dashoffset: 30; }
      .arrow1 { animation-delay: 0.3s; }
      .arrow2 { animation-delay: 0.7s; }
      .arrow3 { animation-delay: 1.1s; }
      .arrow4 { animation-delay: 1.5s; }
      .arrow5 { animation-delay: 1.9s; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; fill: #fff; font-size: 11px; font-weight: 600; }
      .sublabel { font-family: 'Segoe UI', Arial, sans-serif; fill: rgba(255,255,255,0.85); font-size: 8px; }
      .icon { font-size: 20px; }
    </style>
  </defs>

  <!-- Step 1 -->
  <g class="step step1">
    <rect x="10" y="15" width="120" height="90" rx="12" fill="#FF5722"/>
    <text class="icon" x="70" y="48" text-anchor="middle">🎯</text>
    <text class="label" x="70" y="68" text-anchor="middle">Khám phá</text>
    <text class="sublabel" x="70" y="82" text-anchor="middle">Phân tích · Mục tiêu</text>
  </g>

  <!-- Arrow 1 -->
  <line class="arrow arrow1" x1="135" y1="60" x2="160" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <g class="step step2">
    <rect x="160" y="15" width="120" height="90" rx="12" fill="#FF7043"/>
    <text class="icon" x="220" y="48" text-anchor="middle">📐</text>
    <text class="label" x="220" y="68" text-anchor="middle">Thiết kế</text>
    <text class="sublabel" x="220" y="82" text-anchor="middle">UI/UX · Prototype</text>
  </g>

  <!-- Arrow 2 -->
  <line class="arrow arrow2" x1="285" y1="60" x2="310" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->
  <g class="step step3">
    <rect x="310" y="15" width="120" height="90" rx="12" fill="#FF8A65"/>
    <text class="icon" x="370" y="48" text-anchor="middle">⚡</text>
    <text class="label" x="370" y="68" text-anchor="middle">Phát triển</text>
    <text class="sublabel" x="370" y="82" text-anchor="middle">Agile · CI/CD</text>
  </g>

  <!-- Arrow 3 -->
  <line class="arrow arrow3" x1="435" y1="60" x2="460" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 4 -->
  <g class="step step4">
    <rect x="460" y="15" width="120" height="90" rx="12" fill="#FF9800"/>
    <text class="icon" x="520" y="48" text-anchor="middle">🔬</text>
    <text class="label" x="520" y="68" text-anchor="middle">Kiểm thử</text>
    <text class="sublabel" x="520" y="82" text-anchor="middle">Unit · UAT · Perf</text>
  </g>

  <!-- Arrow 4 -->
  <line class="arrow arrow4" x1="585" y1="60" x2="610" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 5 -->
  <g class="step step5">
    <rect x="610" y="15" width="120" height="90" rx="12" fill="#FFB74D"/>
    <text class="icon" x="670" y="48" text-anchor="middle">🚀</text>
    <text class="label" x="670" y="68" text-anchor="middle">Triển khai</text>
    <text class="sublabel" x="670" y="82" text-anchor="middle">Deploy · Monitor</text>
  </g>

  <!-- Arrow 5 -->
  <line class="arrow arrow5" x1="735" y1="60" x2="760" y2="60" stroke="#FF9800" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Step 6 -->
  <g class="step step6">
    <rect x="760" y="15" width="120" height="90" rx="12" fill="#FFC107"/>
    <text class="icon" x="820" y="48" text-anchor="middle">🛡️</text>
    <text class="label" x="820" y="68" text-anchor="middle">Đồng hành</text>
    <text class="sublabel" x="820" y="82" text-anchor="middle">Bảo trì · Hỗ trợ</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF9800"/>
    </marker>
  </defs>
</svg>
