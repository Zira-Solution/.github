<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 70" width="700" height="70">
  <defs>
    <style>
      @keyframes popBreathe {
        0%, 10% { opacity: 0; }
        20%, 70% { opacity: 1; }
        80%, 100% { opacity: 0; }
      }
      @keyframes iconBounce {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      .val { animation: popBreathe 7s ease-in-out infinite; }
      .v1 { animation-delay: 0s; }
      .v2 { animation-delay: 0.4s; }
      .v3 { animation-delay: 0.8s; }
      .v4 { animation-delay: 1.2s; }
      .v5 { animation-delay: 1.6s; }
      .vicon { animation: iconBounce 2s ease-in-out infinite; }
      .vi1 { animation-delay: 0s; }
      .vi2 { animation-delay: 0.4s; }
      .vi3 { animation-delay: 0.8s; }
      .vi4 { animation-delay: 1.2s; }
      .vi5 { animation-delay: 1.6s; }
      .vlbl { font-family: 'Segoe UI', Arial, sans-serif; fill: #fff; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <g class="val v1">
    <rect x="5" y="10" width="125" height="45" rx="22" fill="#FF5722"/>
    <text class="vicon vi1" x="28" y="39" font-size="18">💡</text>
    <text class="vlbl" x="78" y="38" text-anchor="middle">Sáng tạo</text>
  </g>

  <g class="val v2">
    <rect x="140" y="10" width="125" height="45" rx="22" fill="#FF7043"/>
    <text class="vicon vi2" x="163" y="39" font-size="18">🤝</text>
    <text class="vlbl" x="213" y="38" text-anchor="middle">Tận tâm</text>
  </g>

  <g class="val v3">
    <rect x="275" y="10" width="135" height="45" rx="22" fill="#FF8A65"/>
    <text class="vicon vi3" x="298" y="39" font-size="18">🎯</text>
    <text class="vlbl" x="353" y="38" text-anchor="middle">Chất lượng</text>
  </g>

  <g class="val v4">
    <rect x="420" y="10" width="125" height="45" rx="22" fill="#FF9800"/>
    <text class="vicon vi4" x="443" y="39" font-size="18">⚡</text>
    <text class="vlbl" x="493" y="38" text-anchor="middle">Tốc độ</text>
  </g>

  <g class="val v5">
    <rect x="555" y="10" width="125" height="45" rx="22" fill="#FFB74D"/>
    <text class="vicon vi5" x="578" y="39" font-size="18">🔒</text>
    <text class="vlbl" x="628" y="38" text-anchor="middle">Tin cậy</text>
  </g>
</svg>
